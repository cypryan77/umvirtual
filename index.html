<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fullscreen Slideshow</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <h2>Slideshow Controls</h2>
        <p>1. Select a folder with images.</p>
        <p>2. Set the time (in seconds) between images.</p>
        <p>3. Click "Start Slideshow". Press 'Esc' to exit fullscreen.</p>
        <div>
            <label for="fileInput">Select Images/Folder:</label>
            <input type="file" id="fileInput" webkitdirectory directory multiple accept="image/*">
        </div>
        <div>
            <label for="intervalInput">Interval (seconds):</label>
            <input type="number" id="intervalInput" value="3" min="1">
        </div>
        <button id="startButton">Start Slideshow</button>
    </div>

    <div id="slideshowContainer">
        <img id="slideshowImage" src="#" alt="Slideshow Image">
    </div>

    <script src="script.js"></script>
</body>
</html>
