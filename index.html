<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Game</h1>
    <div id="instructions">
        <p>Use <strong>Arrow Keys</strong> to move the snake.</p>
        <p>Eat the <strong>red food</strong> to grow and score points.</p>
        <p>Avoid hitting the <strong>walls</strong> or your <strong>own tail</strong>.</p>
        <p>Press <strong>Enter</strong> or <strong>Space</strong> to start/restart the game.</p>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script src="script.js"></script>
</body>
</html>
